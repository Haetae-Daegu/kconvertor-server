[project]
name = "kconvertor-server"
version = "0.1.0"
description = "Backend server of Korean Convertor project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.12",
    "discord-webhook>=1.4.1",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-swagger-ui>=5.36.0",
    "geopy>=2.5.0",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy-serializer>=1.6.3",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "commitizen>=4.20.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "requests-mock>=1.12.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.black]
target-version = ["py310"]
